apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: hello-apis
  labels:
    app: worker-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
      - name: worker-service
        image: <your-acr-name>.azurecr.io/worker-service:latest
        imagePullPolicy: Always
        env:
        - name: RabbitMQ__Host
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: RABBITMQ_HOST
        - name: RabbitMQ__Port
          value: "5672"
        - name: RabbitMQ__Username
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        - name: RabbitMQ__Queue
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: RABBITMQ_QUEUE
        - name: ProcessingDelayMs
          value: "2000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
