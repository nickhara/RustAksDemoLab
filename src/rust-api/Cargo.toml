[package]
name = "hello-rust-api"
version = "1.0.0"
edition = "2021"
authors = ["Nick Hara"]
description = "Hello World REST API in Rust for Azure Kubernetes Service"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
rustc_version_runtime = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
